name: Buat grafik Close Lost Unit

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "generate_chart.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Buat grafik
        run: python generate_chart.py

      - name: Commit hasil grafik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada grafik."
          else
            git commit -m "Update grafik Close Lost Unit [skip ci]"
            git push
          fi
